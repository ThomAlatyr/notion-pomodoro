<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7e4df" />
    <meta name="color-scheme" content="light" />
    <title>Calendrier minimal</title>
    <meta name="description" content="Un calendrier minimaliste conçu pour être intégré dans Notion." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="widget" aria-label="Calendrier minimaliste">
      <section class="calendar-card">
        <header class="date-summary">
          <time class="day-number" id="dayNumber"></time>

          <div class="date-line">
            <div>
              <p class="month-name" id="monthName"></p>
              <p class="year" id="year"></p>
            </div>
            <p class="weekday" id="weekday"></p>
          </div>
        </header>

        <div class="calendar" aria-label="Vue mensuelle">
          <div class="calendar-toolbar">
            <button class="nav-button" id="previousMonth" type="button" aria-label="Mois précédent">←</button>
            <button class="today-button" id="todayButton" type="button">Aujourd’hui</button>
            <button class="nav-button" id="nextMonth" type="button" aria-label="Mois suivant">→</button>
          </div>

          <div class="weekdays" aria-hidden="true">
            <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
          </div>
          <div class="days" id="days" role="grid" aria-label="Jours du mois"></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
