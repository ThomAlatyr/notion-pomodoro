<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>Pomodoro minimal</title>
    <meta name="description" content="Un compteur Pomodoro minimaliste conçu pour Notion." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="widget" aria-label="Compteur Pomodoro">
      <section class="pomodoro-card">
        <div class="dial">
          <div class="tick-ring" id="tickRing" role="progressbar" aria-label="Progression de la session" aria-valuemin="0" aria-valuemax="1500" aria-valuenow="0"></div>

          <div class="dial-center">
            <h1 class="focus-title">Focus session</h1>
            <button class="timer-toggle" id="timerToggle" type="button" aria-label="Démarrer le minuteur">
              <time class="timer" id="timer" datetime="PT25M" aria-live="off">25:00</time>
            </button>
            <button class="timer-action" id="timerAction" type="button" aria-label="Démarrer le minuteur">Démarrer</button>
          </div>

          <p class="status" id="status" aria-live="polite"></p>
        </div>

        <div class="controls" aria-label="Commandes du minuteur">
          <button class="control" id="pauseButton" type="button" disabled>Pause</button>
          <button class="control" id="resetButton" type="button">Réinitialiser</button>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
